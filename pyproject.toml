[project]
name = "hostpost"
version = "0.3.0"
description = "A Discord bot for preparing and posting event messages, integrated with a database"
readme = "README.md"
authors = [{ name = "lurch", email = "lurch.mclurchington@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.5",
    "aiomysql[rsa]>=0.3.2",
    # APScheduler 4 is a rewrite with a different scheduler API, not an upgrade.
    "apscheduler>=3.11.2,<4",
    "discord-py>=2.7.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
]

[project.scripts]
hostpost = "src.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.82.0",
    "pyright>=1.1.414",
    "ruff>=0.6.9",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
include = ["src", "scripts"]
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["."]
exclude = [".venv", "build", "dist"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "C4",  # flake8-comprehensions
  "N",   # pep8-naming
  "RUF", # ruff-specific
  "D419", # empty docstring; whether a thing has one is a judgement, that it says something is not
]
ignore = [
  "E501", # line length — let the formatter handle it
]
# `–` spans a time range in the wizard; `’` is an apostrophe in help text.
allowed-confusables = ["–", "’"]
