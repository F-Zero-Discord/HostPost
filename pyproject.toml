[project]
name = "hostpost"
version = "0.3.0"
description = "A Discord bot for preparing and posting event messages, integrated with a database"
readme = "README.md"
authors = [{ name = "lurch", email = "lurch.mclurchington@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.5",
    "aiomysql[rsa]>=0.3.2",
    # APScheduler 4 is a rewrite with a different scheduler API, not an upgrade.
    "apscheduler>=3.11.2,<4",
    "discord-py>=2.7.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
]

[project.scripts]
hostpost = "src.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
